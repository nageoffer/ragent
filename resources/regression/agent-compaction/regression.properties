# 记忆摘要回归台配置
# 服务地址、平台库账号、上下文预算来自 application.yaml；业务库账号来自 mcp-server 的 yml，回归台不另存一份
application.config=../../../bootstrap/src/main/resources/application.yaml
application.mcp-config=../../../mcp-server/src/main/resources/application.yml

# 与比特严选初始化器同一个账号：订单 88232 挂在它名下
auth.username=admin
auth.password=admin

server.connect-timeout-seconds=5
server.request-timeout-seconds=120
database.connect-timeout-seconds=5
database.statement-timeout-seconds=120
biz-database.connect-timeout-seconds=5
biz-database.statement-timeout-seconds=60

# 剧本与被测提示词；库里的槽位与文件不一致就拒跑，否则结论说的是另一份提示词
script.file=script.txt
bit.prompts-dir=../../initializer/bit-selection/prompts
bit.profile-name=比特严选 Agent
# 剧本里的订单与用户给的预算；预算数字是用户条件，不按价格算
bit.order-no=88232
bit.budget=4000

# 同一份剧本并行跑几条独立会话；摘要有随机性，一条会话的结论只算一个样本
run.sessions=2
# 第三段 hold3 压出原文之后再观测到几代就跳到末轮：3 代给出两组相邻对比，再往后只是重复；0 表示整本跑完
run.steady-generations=3
# 单轮 SSE 超时要大于服务端 agent.sse-timeout-ms
turn.timeout-seconds=900
turn.interval-seconds=1
# 网络或流中断时重发本轮的次数（含首次）
turn.max-attempts=2
# 状态落库是流结束后的异步收尾，读不到本轮问题就退避重读
probe.max-attempts=10
probe.retry-interval-seconds=2

# 下限仅拦空摘要，内容是否完整由业务检查判断；2000 是本剧本的精简程度上限
bound.min-chars=1
bound.max-chars=2000
# 稳态期（所有事项都已进过摘要之后）相邻两代允许的增长：比例 + 固定余量
bound.steady-growth-ratio=0.15
bound.steady-growth-slack=100
# 压缩后上下文须回落到预算的这个比例以下（保留段是 0.2，再留出摘要与本轮的余量）
bound.max-after-ratio=0.4
# 少于这么多代，长度区间与稳态两条结论都下不了
bound.min-generations=5

# 回归台不删任何数据：会话留在 admin 的侧栏里，要清理请从前端删
