# 直接连接已启动服务，不启动/重启服务，不修改服务配置或业务库。
application.config=../../../bootstrap/src/main/resources/application.yaml
application.mcp-config=../../../mcp-server/src/main/resources/application.yml
auth.username=${RAGENT_REGRESSION_USERNAME:admin}
auth.password=${RAGENT_REGRESSION_PASSWORD:admin}
server.connect-timeout-seconds=5
server.request-timeout-seconds=30
database.connect-timeout-seconds=5
database.statement-timeout-seconds=30
biz-database.connect-timeout-seconds=5
biz-database.statement-timeout-seconds=30
redis.timeout-millis=3000
concurrency.users=4
concurrency.turn-timeout-seconds=300
concurrency.settle-timeout-seconds=60
concurrency.sample-interval-millis=250

# 与后端配置一致，用于采样用户运行名额锁
agent.max-concurrent-runs-per-user=5
