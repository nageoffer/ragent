# RagentAI 服务、PostgreSQL、Redis 和 RAG 后端类型均沿用该文件
application.config=../../../bootstrap/src/main/resources/application.yaml

# 比特严选业务库的连接身份沿用 mcp-server 那份配置：表结构归它建，库的身份自然也以它为准
# 两边各写一遍迟早对不上，对不上的表现是「灌完数据一条也查不到」
application.mcp-config=../../../mcp-server/src/main/resources/application.yml

# 初始化器使用的 Admin 登录账号，业务库里的订单、购物车和券也挂在这个账号名下
auth.username=admin
auth.password=admin

# 初始化器 HTTP 客户端超时参数
server.connect-timeout-seconds=5
server.request-timeout-seconds=120

# 数据库 JDBC URL 和账号来自 application.yaml，PostgreSQL 驱动会自动从项目中加载
database.connect-timeout-seconds=5
database.statement-timeout-seconds=120
# 仅当项目 Classpath、本机 Maven 缓存和 bootstrap/target 都找不到驱动时才需要指定
# database.jdbc-driver-path=/absolute/path/to/postgresql.jar

# 业务库与平台库在同一个 PostgreSQL 实例上但互不知情，超时各配各的
biz-database.connect-timeout-seconds=5
biz-database.statement-timeout-seconds=60

# Redis 连接信息来自 application.yaml，以下只配置初始化器超时和精确清理范围
redis.timeout-millis=5000
redis.cleanup-exact-keys=ragent:intent:tree,ragent:query-term:mappings,ragent:agent:resolved-prompts:v2,ragent:agent:enabled-skills:v1
redis.cleanup-patterns=ragent:memory:summary:lock:*,ragent:agent:running:*,ragent:agent:run-lock:*,ragent:agent:run-permit:*,ragent:stream:cancel:*,ragent:stream:owner:*,ragent:storage:bucket:init:*,ragent:vector:space:init:*,ragent:kb:space:init:*

# 应用暂未主动读取该初始化锁，建议在站点对外开放前执行
execution.require-idle=true
execution.active-window-minutes=30
cleanup.lock-seconds=3600
cleanup.confirmation=RESET-BIT-SELECTION

document.replace-existing=true
document.chunk-timeout-seconds=1200
document.poll-interval-seconds=3

# 预热按 questions.properties 串行提问，单轮超时要大于服务端 rag.default.sse-timeout-ms，否则先断在客户端
warmup.timeout-seconds=600
warmup.interval-seconds=3
# 单轮含首次在内的总尝试次数，用尽后跳过该轮并继续，配成 1 即不重试
warmup.max-attempts=3
warmup.retry-interval-seconds=10
# 提问顺序默认每次随机，填入固定整数可复现某次运行的顺序
# warmup.shuffle-seed=

# 校验期望值，缺省时按数据集自身规模推断——写死是为了让「文档漏传一篇」这类偏差在校验期报错
# 而不是等到检索时表现为「查不到」
verification.knowledge-base-count=4
verification.document-count=69
verification.intent-count=42
verification.question-count=15
verification.skill-count=5

# 业务库行数，只有配了 application.mcp-config 的数据集才会校验
# 商品那条同时钉住「业务库每款商品在知识库里都查得到详情」，它是这套数据集唯一的跨库约束
verification.biz-spu-count=695
verification.biz-sku-count=1420
verification.biz-order-count=8
verification.biz-coupon-count=7
