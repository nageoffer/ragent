# 新建一份人设并激活，不动内置智能体：切回企业助手只要把 active 切回内置，空槽位自动回落
# 十个槽位只填这五个，其余留空——知识与记忆工具声明、长期记忆合并本就与领域无关
# 「历史对话摘要」与「闲聊应答」只在 workflow 档生效，agent 档下没有调用方；填它们是因为内置那两份
# 整段写的是企业语料（年假、报销、建议联系 HR），留着就等于这套数据集在 workflow 档下自报企业助手
# 「长期记忆抽取」规则与内置一致，只把「什么该记、什么不该记」的例子换成商城的：
# 售后排查、维修进度、比较中的商品都是办完就过期的事，内置那份举的是企业办事的例子
# 「Agent上下文压缩」按商城的事整理：一副耳机、一笔订单、一款在考虑的商品各占一条，价格库存不抄数值
# 内置那份按通用办事写，在商城会话里会把每次追问记成一条「了解 X」，摘要随轮数越续越长
name=比特严选 Agent
description=比特严选自营商城的智能助手，查商品、查订单、下单改单、办售后
avatar=gem-amber

prompt.AGENT_MAIN=prompts/agent-main.txt
prompt.CONVERSATION_SUMMARY=prompts/conversation-summary.txt
prompt.SYSTEM_CHAT=prompts/system-chat.txt
prompt.AGENT_MEMORY_EXTRACTION=prompts/memory-extraction.txt
prompt.AGENT_CONTEXT_COMPACTION=prompts/context-compaction.txt
