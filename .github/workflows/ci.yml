name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-maven:
    name: backend-maven
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Spotless check
        # spotless apply 已绑定 compile 阶段，CI 必须显式跑 check 做门禁，
        # 避免 apply 静默改写工作树后混入流程。
        run: ./mvnw -B -ntp spotless:check

      - name: Build
        # 集成测试依赖 Milvus/MySQL/Redis 等外部服务（InvoiceIndexDocumentTests 等
        # SpringBootTest），CI 不执行全量 test，门禁为格式检查 + 编译构建；
        # 测试隔离接入见后续 4.4。
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports"
          if-no-files-found: ignore

  frontend-build-lint:
    name: frontend-build-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 硬门禁：代码必须可编译。
        run: npm run build

      - name: Lint
        # 仓库既有代码存在 21 个存量 lint error（配置加载原就崩溃，从未跑通过），
        # 修复属于业务代码改造，列入后续计划；此处先启用 lint 并完整记录结果，
        # 不阻塞 CI，也不假装 lint 已全绿。
        continue-on-error: true
        run: npm run lint
